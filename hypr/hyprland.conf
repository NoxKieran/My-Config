$mod = SUPER

monitor = ,preferred,auto,1

exec-once = env PATH=$HOME/.local/bin:$PATH QML2_IMPORT_PATH=$HOME/.local/lib64/qt6/qml XDG_CONFIG_DIRS=$HOME/.local/etc/xdg:/etc/xdg qs -c caelestia -n

bind = $mod, RETURN, exec, kitty
bind = $mod, Q, killactive
# bind = $mod, M, exit
bind = $mod, F, fullscreen

misc {
    disable_hyprland_guiutils_check = true
}

--config gaya tarik touchpad
input {
    touchpad {
        natural_scroll = true
    }

    device:syna2ba6:00-06cb:ce2c-touchpad {
        sensitivity = 0.7
    }
}

#############################
### ANIMATIONS
#############################

animations {
    enabled = yes, please :()

    # =========================
    # BEZIER / CURVES
    # =========================

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1


    # =========================
    # GLOBAL
    # =========================

    animation = global, 1, 10, default


    # =========================
    # WINDOW
    # =========================

    # General window animation
    animation = windows, 1, 4.79, easeOutQuint

    # Window saat dibuka
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%

    # Window saat ditutup
    animation = windowsOut, 1, 1.49, linear, popin 87%


    # =========================
    # FADE
    # =========================

    # Fade saat window muncul
    animation = fadeIn, 1, 1.73, almostLinear

    # Fade saat window ditutup
    animation = fadeOut, 1, 1.46, almostLinear

    # Fade umum
    animation = fade, 1, 3.03, quick


    # =========================
    # LAYERS
    # =========================

    # Layer umum
    animation = layers, 1, 3.81, easeOutQuint

    # Layer masuk
    animation = layersIn, 1, 4, easeOutQuint, fade

    # Layer keluar
    animation = layersOut, 1, 1.5, linear, fade

    # Fade layer masuk
    animation = fadeLayersIn, 1, 1.79, almostLinear

    # Fade layer keluar
    animation = fadeLayersOut, 1, 1.39, almostLinear


    # =========================
    # WORKSPACE
    # =========================

    # Workspace geser kiri / kanan
    animation = workspaces, 1, 1.94, almostLinear, slide

    # Workspace masuk
    animation = workspacesIn, 1, 1.21, almostLinear, slide

    # Workspace keluar
    animation = workspacesOut, 1, 1.94, almostLinear, slide


    # =========================
    # BORDER
    # =========================

    animation = border, 1, 5.39, easeOutQuint
    
}
# Lilith Anime Cursor
env = HYPRCURSOR_THEME,Lilith_cursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Lilith_XCursor
env = XCURSOR_SIZE,24
